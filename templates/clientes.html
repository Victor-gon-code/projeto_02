<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="{{url_for('static', filename = 'clientes.css')}}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Alunos</title>
</head>
<body>
    <h1 id="meu_titulo">Clientes Cadastrados no Sistema</h1>

    <div class="tabela-container">
        <table class="tabela-clientes">
            <thead>
                <tr>
                    <th>Nome do Aluno</th>
                    <th>Idade</th>
                    <th>CPF</th>
                    <th>Data</th>
                    <th>atualizar</th>
                    <th>deletar</th>
                </tr>
            </thead>
            <tbody>
                {% for aluno in alunos %}
                <tr>
                    <td>{{ aluno[1] }}</td>
                    <td>{{ aluno[2] }}</td>
                    <td>{{ aluno[3] }}</td>
                    <td>{{ aluno[4] }}</td>
                    <td>
                        <a href="/editar/{{ aluno[0] }}" class="botao-editar" >Editar</a>
                    </td>
                    <td>
                        <a href="/excluir/{{ aluno[0] }}" class="botao-excluir" >Excluir</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="container-voltar">
        <a href="/" class="botao-voltar">← Voltar para o Cadastro</a>
        <br>
        <a href="/logout" class = 'botao-sair'>Sair do Sistema</a>
    </div>

</body>
</html>
